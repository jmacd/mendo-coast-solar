<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mendocino County transmission grid</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    * { box-sizing: border-box; }
    html, body, #app { height: 100%; margin: 0; overflow: hidden; }
    #app { display: grid; grid-template-columns: minmax(210px, 31%) minmax(0, 1fr); }
    #sidebar { border-right: 1px solid; display: flex; flex-direction: column; z-index: 1001; }
    .map-header { border-bottom: 1px solid; padding: 14px 16px 12px; }
    .map-title { line-height: 1.15; margin: 0 0 4px; }
    .map-summary { font-size: 11px; margin: 0; }
    .map-legend { border-bottom: 1px solid var(--map-line); padding: 10px 16px; }
    .map-legend h2 { font-size: 10px; letter-spacing: .08em; margin: 0 0 8px; text-transform: uppercase; }
    .map-status { font-size: 10px; margin-top: auto; padding: 9px 16px; }
    #map { min-width: 0; }
    @media (max-width: 620px) {
      #app { grid-template-columns: minmax(180px, 42%) minmax(0, 1fr); }
    }
  </style>
  <link rel="stylesheet" href="map-theme.css">
</head>
<body>
  <main id="app">
    <aside id="sidebar" class="map-sidebar">
      <header class="map-header">
        <h1 class="map-title">Mendocino transmission grid</h1>
        <p class="map-summary">Published high-voltage lines and feeder substations.</p>
      </header>
      <section class="map-legend" aria-label="Map legend">
        <h2>Infrastructure</h2>
        <div class="map-key"><i class="map-swatch" style="background:#5b2c83"></i>60 kV</div>
        <div class="map-key"><i class="map-swatch" style="background:#2468a2"></i>115 kV</div>
        <div class="map-key"><i class="map-swatch" style="background:#c51b2f"></i>230 kV</div>
        <div class="map-key"><i class="map-swatch" style="background:#ffd447;border:1px solid #17201c;height:10px"></i>Feeder substation</div>
        <div class="map-key"><i class="map-swatch" style="border-top:2px dashed #17201c"></i>County limits</div>
      </section>
      <div id="status" class="map-status">Loading grid infrastructure...</div>
    </aside>
    <div id="map" aria-label="Interactive Mendocino County transmission grid"></div>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="map-infrastructure.js"></script>
  <script>
    const map = L.map("map", { preferCanvas: true });
    map.createPane("infrastructure-lines");
    map.getPane("infrastructure-lines").style.zIndex = 350;
    map.createPane("infrastructure-stations");
    map.getPane("infrastructure-stations").style.zIndex = 650;
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors",
      maxZoom: 19
    }).addTo(map);

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[character]);
    }

    async function loadMap() {
      const resources = [
        ["transmission-lines.geojson", "transmission lines"],
        ["distribution-substations.geojson", "feeder substations"],
        ["county-boundary.geojson", "county boundary"]
      ];
      const responses = await Promise.all(resources.map(([url]) => fetch(url)));
      const failed = responses
        .map((response, index) => response.ok ? null : resources[index][1])
        .filter(Boolean);
      if (failed.length) throw new Error(`Could not load ${failed.join(", ")}`);
      const [transmission, substations, county] = await Promise.all(
        responses.map(response => response.json())
      );
      const countyLayer = L.geoJSON(county, {
        pane: "infrastructure-lines",
        style: MapInfrastructure.countyStyle
      }).addTo(map);
      const transmissionLayer = L.geoJSON(transmission, {
        pane: "infrastructure-lines",
        style: MapInfrastructure.transmissionStyle,
        onEachFeature: (feature, layer) => layer.bindTooltip(
          MapInfrastructure.tooltip(feature.properties, [
            ["TLINE_NAME", "Transmission line"],
            ["RATEDKV", "Rated kV"]
          ], esc),
          { sticky: true }
        )
      }).addTo(map);
      const stationLayer = L.geoJSON(substations, {
        pane: "infrastructure-stations",
        pointToLayer: (feature, latlng) => MapInfrastructure.substationMarker(latlng),
        onEachFeature: (feature, layer) => {
          const properties = feature.properties;
          layer.bindTooltip(esc(properties.SubstationName), {
            className: "station-label",
            direction: "right",
            permanent: true
          });
          layer.bindPopup(MapInfrastructure.tooltip(properties, [
            ["SubstationName", "Substation"],
            ["Voltage_kV", "Distribution voltage kV"],
            ["NUMBANKS", "Banks"]
          ], esc));
        }
      }).addTo(map);
      map.fitBounds(L.featureGroup([
        countyLayer,
        transmissionLayer,
        stationLayer
      ]).getBounds(), { padding: [18, 18] });
      document.querySelector("#status").textContent =
        `${transmission.features.length} line features · ` +
        `${substations.features.length} feeder substations`;
    }

    loadMap().catch(error => {
      document.querySelector("#status").textContent = error.message;
    });
  </script>
</body>
</html>
