<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 260" role="img" aria-labelledby="title desc">
  <title id="title">Solar siting analysis pipeline</title>
  <desc id="desc">Public data is filtered through jurisdiction and environmental screens, analyzed for terrain and grid access, then ranked into 206 candidates.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#789184"/>
    </marker>
    <style>
      .box{fill:#fffdf7;stroke:#b9c8bd;stroke-width:2}.final{fill:#245c43;stroke:#143c2b}
      .head{font:700 18px system-ui,sans-serif;fill:#173128}.copy{font:14px system-ui,sans-serif;fill:#52675f}
      .finalText{fill:#fff}.line{stroke:#789184;stroke-width:3;marker-end:url(#arrow)}
      .num{font:500 34px Georgia,serif;fill:#e6a93b}
    </style>
  </defs>
  <path class="line" d="M220 130h55"/>
  <path class="line" d="M455 130h55"/>
  <path class="line" d="M690 130h55"/>
  <path class="line" d="M925 130h55"/>
  <g transform="translate(10 45)">
    <rect class="box" width="210" height="170" rx="15"/>
    <text class="num" x="22" y="45">15,927</text>
    <text class="head" x="22" y="77">Grid-access parcels</text>
    <text class="copy" x="22" y="106">Full parcels within 1 km</text>
    <text class="copy" x="22" y="128">of coast-serving feeders</text>
  </g>
  <g transform="translate(275 45)">
    <rect class="box" width="180" height="170" rx="15"/>
    <text class="num" x="22" y="45">01</text>
    <text class="head" x="22" y="77">Exclusions</text>
    <text class="copy" x="22" y="106">Wetlands · protected</text>
    <text class="copy" x="22" y="128">farmland · jurisdiction</text>
  </g>
  <g transform="translate(510 45)">
    <rect class="box" width="180" height="170" rx="15"/>
    <text class="num" x="22" y="45">02</text>
    <text class="head" x="22" y="77">Land test</text>
    <text class="copy" x="22" y="106">Open · flat · connected</text>
    <text class="copy" x="22" y="128">at least 10 acres</text>
  </g>
  <g transform="translate(745 45)">
    <rect class="box" width="180" height="170" rx="15"/>
    <text class="num" x="22" y="45">03</text>
    <text class="head" x="22" y="77">Grid test</text>
    <text class="copy" x="22" y="106">Three-phase within 1 km</text>
    <text class="copy" x="22" y="128">feeder and ICA metrics</text>
  </g>
  <g transform="translate(980 45)">
    <rect class="final" width="190" height="170" rx="15"/>
    <text class="num" x="22" y="45">206</text>
    <text class="head finalText" x="22" y="77">Ranked sites</text>
    <text class="copy finalText" x="22" y="106">Comparable land, demand,</text>
    <text class="copy finalText" x="22" y="128">grid, sun and scenic scores</text>
  </g>
</svg>
